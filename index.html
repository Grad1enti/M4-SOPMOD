<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eceae5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Interactive 3D exploded view of an M4A1 carbine in SOPMOD configuration with FDE furniture." />
  <title>M4A1 SOPMOD Exploded</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene" aria-label="3D model of an M4A1 carbine in SOPMOD configuration"></canvas>

  <header class="top">
    <div class="title">
      <h1>M4A1 SOPMOD</h1>
      <p id="subtitle">5.56×45 mm · 14.5 in barrel · FDE furniture</p>
    </div>
    <div class="top-btns">
      <button id="theme" class="icon-btn" type="button" aria-label="Colour theme: follows system" title="Colour theme">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
      <button id="resetView" class="icon-btn" type="button" aria-label="Reset view" title="Reset view">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <aside id="info" class="info" hidden aria-live="polite">
    <div class="info-head">
      <span class="cat-dot" id="infoDot"></span>
      <span class="info-cat" id="infoCat"></span>
      <button id="infoClose" class="close" type="button" aria-label="Close">×</button>
    </div>
    <h2 id="infoName"></h2>
    <p id="infoDesc"></p>
  </aside>

  <div id="hint" class="hint">Drag to orbit · pinch to zoom · tap a part</div>

  <section class="panel" aria-label="Controls">
    <div class="chips" id="chips" role="radiogroup" aria-label="Show parts group"></div>
    <div class="row">
      <label for="explode" class="lbl">Pull apart</label>
      <input id="explode" type="range" min="0" max="100" value="0" step="1" />
      <span class="stat" id="stat"></span>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
